packages:
  - .

allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  msw: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - mysql2@3.24.6

# Compatible patch releases for transitive advisories; no cross-major overrides.
overrides:
  "mysql2@3": 3.24.6
  "fast-uri@3": 3.1.8
  "brace-expansion@5": 5.0.12
